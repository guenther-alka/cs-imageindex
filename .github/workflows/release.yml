name: Release

# Builds cs-imageindex for Linux, Windows and macOS on GitHub-hosted runners
# and attaches the binaries to the GitHub Release for the pushed tag.
#
# illumos/OmniOS is deliberately NOT part of this workflow: GitHub Actions'
# runner binary (actions/runner) has no illumos/SunOS build at all, so a
# "self-hosted runner on omni58.189" is not actually possible the way it is
# for Linux/Windows/macOS. The illumos build stays a manual, documented
# process -- see illumos/cs-imageindex_omnios_1a.sh and
# data/howto.ai/cs-imageindex.info in the napp-it CS project for the full
# background. After this workflow finishes a release, build illumos by hand
# with that script and upload the resulting tarball to the same release
# (gh release upload <tag> cs-imageindex-illumos.amd64.tar.gz).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cs-imageindex-linux.amd64
            bin: cs-imageindex
            ffp: linux
            ffa: amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cs-imageindex-mswin.amd64
            bin: cs-imageindex.exe
            ffp: mswin
            ffa: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cs-imageindex-darwin.arm64
            bin: cs-imageindex
            ffp: darwin
            ffa: arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cs-imageindex-darwin.amd64
            bin: cs-imageindex
            cross: true
            ffp: darwin
            ffa: amd64

    runs-on: ${{ matrix.os }}
    env:
      # tag whose release carries the prebuilt ffmpeg/ffprobe assets
      # (cs-imageindex-ffmpeg-<platform>.<arch>.tar.gz, built once by
      # .github/workflows/ffmpeg-build.yml)
      FFMPEG_ASSET_TAG: v0.3.0

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        # --no-default-features disables the "heic" cargo feature here: it
        # links the system libheif C library via pkg-config (>= 1.23), which
        # none of the GitHub-hosted runner images provide out of the box.
        # RAW photo support (pure Rust) and video support (external ffmpeg,
        # not linked) are unaffected. HEIC/HEIF files are simply skipped like
        # any other unreadable file in these CI-built binaries -- HEIC is
        # fully supported in the hand-built illumos binary (which does have
        # libheif installed, see illumos/cs-imageindex_omnios_1a.sh) and in
        # any binary a user builds themselves with libheif >= 1.23 present.
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      # ---- bundle the prebuilt static LGPL ffmpeg/ffprobe into dist/ -------
      # (built once by .github/workflows/ffmpeg-build.yml, stored on the
      # FFMPEG_ASSET_TAG release as cs-imageindex-ffmpeg-<platform>.<arch>.tar.gz)
      - name: Bundle ffmpeg (prebuilt LGPL asset)
        run: |
          set -e
          mkdir -p dist
          curl -sSL "https://github.com/guenther-alka/cs-imageindex/releases/download/${FFMPEG_ASSET_TAG}/cs-imageindex-ffmpeg-${{ matrix.ffp }}.${{ matrix.ffa }}.tar.gz" -o /tmp/ffmpeg-bundle.tar.gz
          tar -xzf /tmp/ffmpeg-bundle.tar.gz -C dist

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md LICENSE LICENSE-ffmpeg.txt dist/
          mkdir -p dist/models
          cp models/*.onnx models/LICENSE-*.txt dist/models/
          cd dist
          # all platforms ship a .tar.gz -- napp-it CS Tools "tar" convention
          # (<asset>-<platform>.<arch>.tar.gz; extracted by bsdtar on Windows)
          tar -czf ../${{ matrix.artifact }}.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Prebuilt binaries for Linux, Windows and macOS (arm64 + x86_64),
            built automatically by this workflow. These builds support still
            images, RAW photos, and video -- a minimal static LGPL
            ffmpeg/ffprobe is bundled in each archive (built from source by
            ci/build-ffmpeg.sh), so video indexing works out of the box.
            HEIC/HEIF is NOT supported in these CI builds -- the GitHub-hosted
            runners don't provide a system libheif >= 1.23, so the binaries
            are built with --no-default-features. Build from source with
            libheif installed for HEIC support on these platforms.

            illumos/OmniOS is NOT built by CI (GitHub Actions has no runner
            for illumos) -- built manually via
            illumos/cs-imageindex_omnios_1a.sh and uploaded to this release
            separately when available. The illumos binary DOES include full
            HEIC/HEIF support.

            Asset names follow the napp-it CS Tools convention
            (<asset>-<platform>.<arch>.tar.gz) for the "About > CS Tools
            Download" menu.
