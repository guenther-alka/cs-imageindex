name: Release

# Builds cs-imageindex for Linux, Windows and macOS on GitHub-hosted runners
# and attaches the binaries to the GitHub Release for the pushed tag.
#
# illumos/OmniOS is deliberately NOT part of this workflow: GitHub Actions'
# runner binary (actions/runner) has no illumos/SunOS build at all, so a
# "self-hosted runner on omni58.189" is not actually possible the way it is
# for Linux/Windows/macOS. The illumos build stays a manual, documented
# process -- see illumos/cs-imageindex_omnios_1a.sh and
# data/howto.ai/cs-imageindex.info in the napp-it CS project for the full
# background. After this workflow finishes a release, build illumos by hand
# with that script and upload the resulting tarball to the same release
# (gh release upload <tag> cs-imageindex-illumos-x86_64.tar.gz).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cs-imageindex-linux-x86_64
            bin: cs-imageindex
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cs-imageindex-windows-x86_64
            bin: cs-imageindex.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cs-imageindex-macos-arm64
            bin: cs-imageindex
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cs-imageindex-macos-x86_64
            bin: cs-imageindex
            cross: true

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        # --no-default-features disables the "heic" cargo feature here: it
        # links the system libheif C library via pkg-config (>= 1.23), which
        # none of the GitHub-hosted runner images provide out of the box.
        # RAW photo support (pure Rust) and video support (external ffmpeg,
        # not linked) are unaffected. HEIC/HEIF files are simply skipped like
        # any other unreadable file in these CI-built binaries -- HEIC is
        # fully supported in the hand-built illumos binary (which does have
        # libheif installed, see illumos/cs-imageindex_omnios_1a.sh) and in
        # any binary a user builds themselves with libheif >= 1.23 present.
        run: cargo build --release --target ${{ matrix.target }} --no-default-features

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md LICENSE dist/
          mkdir -p dist/models
          cp models/*.onnx models/LICENSE-*.txt dist/models/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../${{ matrix.artifact }}.zip .
          else
            tar -czf ../${{ matrix.artifact }}.tar.gz .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Prebuilt binaries for Linux, Windows and macOS (arm64 + x86_64),
            built automatically by this workflow. These builds support still
            images, RAW photos, and video (given ffmpeg on PATH), but NOT
            HEIC/HEIF -- the GitHub-hosted runners don't provide a system
            libheif >= 1.23, so these binaries are built with
            --no-default-features. Build from source with libheif installed
            for HEIC support on these platforms.

            illumos/OmniOS is NOT built by CI (GitHub Actions has no runner
            for illumos) -- built manually via
            illumos/cs-imageindex_omnios_1a.sh and uploaded to this release
            separately when available. The illumos binary DOES include full
            HEIC/HEIF support.
