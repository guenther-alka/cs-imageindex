name: Release

# Builds cs-imageindex for Linux, Windows and macOS on GitHub-hosted runners
# and attaches the binaries to the GitHub Release for the pushed tag.
#
# illumos/OmniOS is deliberately NOT part of this workflow: GitHub Actions'
# runner binary (actions/runner) has no illumos/SunOS build at all, so a
# "self-hosted runner on omni58.189" is not actually possible the way it is
# for Linux/Windows/macOS. The illumos build stays a manual, documented
# process -- see illumos/cs-imageindex_omnios_1a.sh and
# data/howto.ai/cs-imageindex.info in the napp-it CS project for the full
# background. After this workflow finishes a release, build illumos by hand
# with that script and upload the resulting tarball to the same release
# (gh release upload <tag> cs-imageindex-illumos.amd64.tar.gz).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: cs-imageindex-linux.amd64
            bin: cs-imageindex
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: cs-imageindex-mswin.amd64
            bin: cs-imageindex.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: cs-imageindex-darwin.arm64
            bin: cs-imageindex
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: cs-imageindex-darwin.amd64
            bin: cs-imageindex
            cross: true
            ff_target_arch: x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release)
        # HEIC/HEIF is decoded via the bundled ffmpeg (ISOBMFF/mov demuxer +
        # built-in HEVC decoder) -- no system libheif dependency. RAW (pure
        # Rust) and video (bundled ffmpeg) are handled the same way.
        run: cargo build --release --target ${{ matrix.target }}

      # ---- build + bundle a minimal static LGPL ffmpeg/ffprobe into dist/ --
      # one self-contained archive per platform (same as the illumos build).
      # ci/build-ffmpeg.sh; FFMPEG_TARGET_ARCH cross-compiles the darwin
      # amd64 build from the arm64 macos-latest runner.
      - name: Setup MSYS2 (Windows ffmpeg toolchain)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            make

      - name: Install ffmpeg build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build ffmpeg (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash ci/build-ffmpeg.sh dist

      - name: Build ffmpeg (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          FFMPEG_TARGET_ARCH: ${{ matrix.ff_target_arch }}
        run: bash ci/build-ffmpeg.sh dist

      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/
          cp README.md LICENSE LICENSE-ffmpeg.txt dist/
          mkdir -p dist/models
          cp models/*.onnx models/LICENSE-*.txt dist/models/
          cd dist
          # all platforms ship a .tar.gz -- napp-it CS Tools "tar" convention
          # (<asset>-<platform>.<arch>.tar.gz; extracted by bsdtar on Windows)
          tar -czf ../${{ matrix.artifact }}.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Prebuilt binaries for Linux, Windows and macOS (arm64 + x86_64),
            built automatically by this workflow. These builds support still
            images, RAW photos, and video -- a minimal static LGPL
            ffmpeg/ffprobe is bundled in each archive (built from source by
            ci/build-ffmpeg.sh), so video indexing works out of the box.
            HEIC/HEIF is decoded via the bundled ffmpeg (ISOBMFF/mov demuxer +
            built-in HEVC decoder) -- no system libheif needed, so it works
            out of the box on all platforms.

            illumos/OmniOS is NOT built by CI (GitHub Actions has no runner
            for illumos) -- built manually via
            illumos/cs-imageindex_omnios_1a.sh and uploaded to this release
            separately when available. The illumos binary DOES include full
            HEIC/HEIF support.

            Asset names follow the napp-it CS Tools convention
            (<asset>-<platform>.<arch>.tar.gz) for the "About > CS Tools
            Download" menu.
