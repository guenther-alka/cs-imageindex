[package]
name = "cs-imageindex"
version = "0.3.0"
edition = "2021"
description = "Index a folder of photos and videos: EXIF/container date/GPS, an LLM scene description, and face recognition against reference photos -- single static binary."
license = "BSD-2-Clause"

[[bin]]
name = "cs-imageindex"
path = "src/main.rs"

[features]
default = ["heic"]
# HEIC/HEIF support decodes via the system libheif C library, loaded lazily
# at runtime (dlopen/LoadLibrary via the libloading crate) -- no build-time
# system dependency. If libheif is missing on the target machine, the binary
# still runs and HEIC/HEIF files are simply skipped (see README).
heic = ["dep:libloading"]

[dependencies]
tract-onnx = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff"] }
kamadak-exif = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
rawloader = "0.37.2"
imagepipe = "0.5.1"
libloading = { version = "0.8", optional = true }

[profile.release]
opt-level = 3
